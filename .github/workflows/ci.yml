name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is declared in requires-python but has no build for the current
        # ubuntu-latest image, so it is not exercised here.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test suite (unittest, no install step)
        run: python -m unittest discover -s tests -v
      - name: Server answers a protocol handshake
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | python chrono_mcp.py \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['id']==1; assert d['result']['serverInfo']['name']=='chrono-mcp'; print('handshake ok:', d['result']['protocolVersion'])"
