[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chrono-mcp"
version = "0.1.0"
description = "Zero-dependency date & time MCP server — one file, pure Python standard library, DST-aware"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["mcp", "model-context-protocol", "time", "timezone", "date", "agent-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# No runtime dependencies — that is the point.

[project.scripts]
chrono-mcp = "chrono_mcp:main"

[tool.setuptools]
py-modules = ["chrono_mcp"]
